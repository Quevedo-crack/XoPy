name: UI preview

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar
        run: >
          dotnet publish XoPy/XoPy.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Preparar archivos de prueba
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\xopytest\carpeta | Out-Null
          1..3 | ForEach-Object { Set-Content "C:\xopytest\carpeta\foto$_.jpg" ("x" * 4096) }
          Set-Content "C:\xopytest\informe.pdf" ("y" * 10240)
          Set-Content "C:\xopytest\video.mp4" ("z" * 20480)
          $legacy = @(
            '*\shell\XoPyCopy', '*\shell\XoPyCopyTo', '*\shell\XoPyMove', '*\shell\XoPyMoveTo', '*\shell\XoPyVerify',
            'Directory\shell\XoPyCopy', 'Directory\shell\XoPyCopyTo', 'Directory\shell\XoPyMove', 'Directory\shell\XoPyMoveTo', 'Directory\shell\XoPyVerify',
            'Directory\Background\shell\XoPyPaste', 'Directory\Background\shell\XoPyOpen'
          )
          foreach ($key in $legacy) {
            $created = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey("Software\Classes\$key")
            $created.Dispose()
          }

      - name: Capturar la ventana principal
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $arguments = @('--screenshot', 'C:\xopytest\shot.png', 'C:\xopytest\informe.pdf', 'C:\xopytest\video.mp4', 'C:\xopytest\carpeta')
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'La aplicación no terminó' }
          "exitcode=$($process.ExitCode) exited=$($process.HasExited)" | Set-Content C:\xopytest\exitcode.txt
          foreach ($extra in @('C:\xopytest\shot.png.log', 'C:\xopytest\shot.png.error.txt')) {
            if (Test-Path $extra) { Write-Host "--- $extra"; Get-Content $extra }
          }
          if (-not (Test-Path 'C:\xopytest\shot.png')) {
            throw "No se generó la captura (código $($process.ExitCode))"
          }
          $startup = Join-Path $env:LOCALAPPDATA 'XoPy\startup.log'
          if (Test-Path $startup) {
            # El log va como anotación para poder leerlo (los logs del run no son accesibles).
            $tail = (Get-Content $startup | Select-Object -Last 40) -join ' | '
            $tail = $tail -replace '%','%25' -replace '\r','' -replace '\n','%0A'
            $tail = $tail.Substring(0, [Math]::Min(60000, $tail.Length))
            Write-Host "::warning title=startup.log::$tail"
          }
          $legacy = @(
            '*\shell\XoPyCopy', '*\shell\XoPyCopyTo', '*\shell\XoPyMove', '*\shell\XoPyMoveTo', '*\shell\XoPyVerify',
            'Directory\shell\XoPyCopy', 'Directory\shell\XoPyCopyTo', 'Directory\shell\XoPyMove', 'Directory\shell\XoPyMoveTo', 'Directory\shell\XoPyVerify',
            'Directory\Background\shell\XoPyPaste', 'Directory\Background\shell\XoPyOpen'
          )
          $remaining = @($legacy | Where-Object { [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\Classes\$_") -ne $null })
          if ($remaining.Count -gt 0) { throw "No se limpiaron las claves antiguas: $($remaining -join ', ')" }
          New-Item -ItemType Directory -Force docs | Out-Null
          Copy-Item 'C:\xopytest\shot.png' 'docs\xopy-preview.png'

      - name: Capturar las pestañas de la ventana
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $arguments = @('--screenshot-tabs', 'C:\xopytest\tab', 'C:\xopytest\informe.pdf', 'C:\xopytest\carpeta')
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'No se generaron las capturas de las pestañas' }
          if (-not (Test-Path 'C:\xopytest\tab-0.png')) { throw "Faltan las capturas de las pestañas (código $($process.ExitCode))" }
          Get-ChildItem 'C:\xopytest\tab-*.png' | ForEach-Object { Move-Item $_.FullName ("docs\xopy-tab-" + $_.Name.Substring(4)) -Force }

      - name: Capturar los menús desplegables
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--screenshot-menus', 'C:\xopytest\menu') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'No se generaron las capturas de los menús' }
          if (-not (Test-Path 'C:\xopytest\menu-menu.png')) { throw 'No se generó la captura del menú desplegable' }
          Copy-Item 'C:\xopytest\menu-menu.png' 'docs\xopy-dropdown.png' -Force
          Copy-Item 'C:\xopytest\menu-context.png' 'docs\xopy-contextmenu.png' -Force

      - name: Capturar los diálogos
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $ok = $true
          foreach ($pair in @(@('--screenshot-options', 'C:\xopytest\options.png'), @('--screenshot-conflict', 'C:\xopytest\conflict.png'))) {
            $process = Start-Process -FilePath $exe -ArgumentList $pair -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); $ok = $false }
            if (-not (Test-Path $pair[1])) { $ok = $false }
          }
          Copy-Item 'C:\xopytest\options.png' 'docs\xopy-options.png' -Force -ErrorAction SilentlyContinue
          Copy-Item 'C:\xopytest\conflict.png' 'docs\xopy-conflict.png' -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList @('--screenshot-history', 'C:\xopytest\history.png') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); $ok = $false }
          if (Test-Path 'C:\xopytest\history.png') { Copy-Item 'C:\xopytest\history.png' 'docs\xopy-history.png' -Force } else { $ok = $false }
          # «Opciones avanzadas»: regresión del error «No se puede agregar 'Button' a 'TabControl'».
          $adv = 'C:\xopytest\advanced.png'
          $process = Start-Process -FilePath $exe -ArgumentList @('--screenshot-advanced', $adv) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Las opciones avanzadas no terminaron' }
          if (-not (Test-Path $adv)) { throw 'No se generó la captura de las opciones avanzadas' }
          if (Test-Path ($adv + '.error.txt')) { throw ("Opciones avanzadas falló: " + (Get-Content ($adv + '.error.txt') -Raw)) }
          Copy-Item $adv 'docs\xopy-advanced.png' -Force
          # VISTA REDUCIDA: es con la que arranca XoPy, así que cada compilación la retrata.
          $small = 'C:\xopytest\compacta.png'
          $process = Start-Process -FilePath $exe -ArgumentList @('--screenshot-compact', $small, 'C:\xopytest\informe.pdf') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'La vista reducida no terminó' }
          if (-not (Test-Path $small)) { throw 'No se generó la captura de la vista reducida' }
          Copy-Item $small 'docs\xopy-compacta.png' -Force
          if (-not $ok) { throw 'No se pudieron capturar los diálogos' }

      - name: Probar una copia real
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          New-Item -ItemType Directory -Force C:\xopytest\destino | Out-Null
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--to', 'C:\xopytest\destino', 'C:\xopytest\informe.pdf', 'C:\xopytest\carpeta') -PassThru
          Start-Sleep -Seconds 15
          $report = @()
          $file = 'C:\xopytest\destino\informe.pdf'
          $folderFile = 'C:\xopytest\destino\carpeta\foto1.jpg'
          $report += "archivo_copiado=$(Test-Path $file)"
          $report += "carpeta_copiada=$(Test-Path $folderFile)"
          if (Test-Path $file) {
            $report += "tamano_copiado=$((Get-Item $file).Length)"
            $report += "hash_igual=$((Get-FileHash $file).Hash -eq (Get-FileHash C:\xopytest\informe.pdf).Hash)"
          }
          $report | Set-Content C:\xopytest\copiatest.txt
          if (-not $process.HasExited) { $process.Kill() }
          Get-Content C:\xopytest\copiatest.txt
          if (-not (Test-Path $file) -or -not (Test-Path $folderFile)) { throw 'La copia no se completó' }
          if ((Get-FileHash $file).Hash -ne (Get-FileHash C:\xopytest\informe.pdf).Hash) { throw 'El contenido copiado no coincide' }

      - name: Probar conflicto y destino de solo lectura
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          [IO.File]::WriteAllBytes('C:\xopytest\destino\video.mp4', [byte[]]::new(100))
          (Get-Item 'C:\xopytest\destino\video.mp4').IsReadOnly = $true
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--overwrite', '--to', 'C:\xopytest\destino', 'C:\xopytest\video.mp4', '--verify', '--algo', 'sha256') -PassThru
          Start-Sleep -Seconds 12
          if (-not $process.HasExited) { $process.Kill() }
          $report = @()
          $report += "tamano=$((Get-Item 'C:\xopytest\destino\video.mp4').Length)"
          $report += "hash_igual=$((Get-FileHash 'C:\xopytest\destino\video.mp4').Hash -eq (Get-FileHash 'C:\xopytest\video.mp4').Hash)"
          $report += "solo_lectura=$((Get-Item 'C:\xopytest\destino\video.mp4').IsReadOnly)"
          $report | Set-Content C:\xopytest\conflictotest.txt
          Get-Content C:\xopytest\conflictotest.txt
          if ((Get-FileHash 'C:\xopytest\destino\video.mp4').Hash -ne (Get-FileHash 'C:\xopytest\video.mp4').Hash) { throw 'No se pudo sobrescribir el archivo de solo lectura' }

          [IO.File]::WriteAllBytes('C:\xopytest\destino\video.mp4', [byte[]]::new(50))
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--skip', '--to', 'C:\xopytest\destino', 'C:\xopytest\video.mp4') -PassThru
          Start-Sleep -Seconds 10
          $size = (Get-Item 'C:\xopytest\destino\video.mp4').Length
          if (-not $process.HasExited) { $process.Kill() }
          "omitido_tamano=$size" | Add-Content C:\xopytest\conflictotest.txt
          if ($size -ne 50) { throw "La política de omisión modificó el archivo ($size bytes)" }

      - name: Capturar la verificación de una copia
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--test', '--exit', '--to', 'C:\xopytest\destino', 'C:\xopytest\informe.pdf', '--screenshot', 'C:\xopytest\verify.png') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'La verificación no terminó' }
          if (-not (Test-Path 'C:\xopytest\verify.png')) { throw 'No se generó la captura de verificación' }
          Copy-Item 'C:\xopytest\verify.png' 'docs\xopy-verify.png'

      - name: Probar un movimiento real
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          New-Item -ItemType Directory -Force C:\xopytest\destino2 | Out-Null
          Set-Content C:\xopytest\mover.txt ("m" * 5000)
          $process = Start-Process -FilePath $exe -ArgumentList @('--move', '--exit', '--to', 'C:\xopytest\destino2', 'C:\xopytest\mover.txt') -PassThru
          Start-Sleep -Seconds 12
          $report = @()
          $report += "movido=$(Test-Path 'C:\xopytest\destino2\mover.txt')"
          $report += "origen_eliminado=$(-not (Test-Path 'C:\xopytest\mover.txt'))"
          $report | Set-Content C:\xopytest\movetest.txt
          if (-not $process.HasExited) { $process.Kill() }
          Get-Content C:\xopytest\movetest.txt
          if (-not (Test-Path 'C:\xopytest\destino2\mover.txt')) { throw 'El movimiento no se completó' }
          if (Test-Path 'C:\xopytest\mover.txt') { throw 'El origen no se eliminó tras mover' }

          # Mover una carpeta completa debe borrar el árbol de origen (como «Cortar y pegar»).
          New-Item -ItemType Directory -Force C:\xopytest\movercarpeta\sub | Out-Null
          Set-Content 'C:\xopytest\movercarpeta\uno.txt' ('u' * 4096)
          Set-Content 'C:\xopytest\movercarpeta\sub\dos.txt' ('d' * 4096)
          $process = Start-Process -FilePath $exe -ArgumentList @('--move', '--exit', '--to', 'C:\xopytest\destino2', 'C:\xopytest\movercarpeta') -PassThru
          Start-Sleep -Seconds 14
          if (-not $process.HasExited) { $process.Kill() }
          "carpeta_movida=$(Test-Path 'C:\xopytest\destino2\movercarpeta\sub\dos.txt')" | Add-Content C:\xopytest\movetest.txt
          "carpeta_origen_eliminada=$(-not (Test-Path 'C:\xopytest\movercarpeta'))" | Add-Content C:\xopytest\movetest.txt
          Get-Content C:\xopytest\movetest.txt
          if (-not (Test-Path 'C:\xopytest\destino2\movercarpeta\sub\dos.txt')) { throw 'La carpeta no se movió' }
          if (Test-Path 'C:\xopytest\movercarpeta') { throw 'La carpeta de origen no se eliminó tras mover' }

      - name: Probar el motor Robocopy
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          New-Item -ItemType Directory -Force C:\xopytest\dest-rbcopy | Out-Null
          Set-Content C:\xopytest\rbcopy.bin ('q' * 200000)
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--engine', 'robocopy', '--to', 'C:\xopytest\dest-rbcopy', 'C:\xopytest\rbcopy.bin') -PassThru
          Start-Sleep -Seconds 14
          if (-not $process.HasExited) { $process.Kill() }
          $source = (Get-FileHash C:\xopytest\rbcopy.bin -Algorithm SHA256).Hash
          $copy = if (Test-Path 'C:\xopytest\dest-rbcopy\rbcopy.bin') { (Get-FileHash 'C:\xopytest\dest-rbcopy\rbcopy.bin' -Algorithm SHA256).Hash } else { 'no-existe' }
          $lines = @("robocopy_copiado=$(Test-Path 'C:\xopytest\dest-rbcopy\rbcopy.bin')", "robocopy_hash_igual=$($source -eq $copy)")
          $lines | Set-Content C:\xopytest\robocopytest.txt
          Get-Content C:\xopytest\robocopytest.txt
          if ($source -ne $copy) { throw 'Robocopy no copió el archivo correctamente' }

      - name: Probar jerarquía, varios destinos y checksums
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          New-Item -ItemType Directory -Force C:\xopytest\jerarquia\sub | Out-Null
          Set-Content 'C:\xopytest\jerarquia\sub\anidado.txt' ('n' * 8192)
          Set-Content 'C:\xopytest\jerarquia\raiz.txt' ('r' * 2048)
          New-Item -ItemType Directory -Force C:\xopytest\jerarquia\vacia | Out-Null
          New-Item -ItemType Directory -Force C:\xopytest\dest3, C:\xopytest\dest4 | Out-Null
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--checksums', '--to', 'C:\xopytest\dest3', '--to2', 'C:\xopytest\dest4', 'C:\xopytest\jerarquia', 'C:\xopytest\informe.pdf') -PassThru
          if ($process.WaitForExit(60000)) { Start-Sleep -Seconds 2 } else { $process.Kill(); Start-Sleep -Seconds 1 }
          $report = @()
          $report += "anidado_dest1=$(Test-Path 'C:\xopytest\dest3\jerarquia\sub\anidado.txt')"
          $report += "anidado_dest2=$(Test-Path 'C:\xopytest\dest4\jerarquia\sub\anidado.txt')"
          $report += "vacia_dest1=$(Test-Path 'C:\xopytest\dest3\jerarquia\vacia')"
          $report += "plano_dest1=$(Test-Path 'C:\xopytest\dest3\anidado.txt')"
          $report += "archivo_suelto=$(Test-Path 'C:\xopytest\dest3\informe.pdf')"
          $report += "checksums=$((Get-ChildItem 'C:\xopytest\dest3' -Filter 'XoPy-checksums-*').Count)"
          $report | Set-Content C:\xopytest\jerarquiatest.txt
          Get-Content C:\xopytest\jerarquiatest.txt
          if (-not (Test-Path 'C:\xopytest\dest3\jerarquia\sub\anidado.txt')) { throw 'No se conservó la subcarpeta en el destino principal' }
          if (-not (Test-Path 'C:\xopytest\dest4\jerarquia\sub\anidado.txt')) { throw 'No se copió al segundo destino' }
          if (-not (Test-Path 'C:\xopytest\dest3\jerarquia\vacia')) { throw 'No se creó la carpeta vacía' }
          if (Test-Path 'C:\xopytest\dest3\anidado.txt') { throw 'Los archivos se aplanaron en el destino' }
          if (-not (Test-Path 'C:\xopytest\dest3\informe.pdf')) { throw 'No se copió el archivo suelto' }
          if ((Get-ChildItem 'C:\xopytest\dest3' -Filter 'XoPy-checksums-*').Count -lt 1) { throw 'No se generó el archivo de checksums' }

      - name: Probar la reanudación de archivos parciales
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          New-Item -ItemType Directory -Force C:\xopytest\dest5 | Out-Null
          $bytes = [byte[]]::new(300000)
          (New-Object Random 7).NextBytes($bytes)
          [IO.File]::WriteAllBytes('C:\xopytest\grande.bin', $bytes)
          [IO.File]::WriteAllBytes('C:\xopytest\dest5\.grande.bin.xopy-part', $bytes[0..149999])
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--to', 'C:\xopytest\dest5', 'C:\xopytest\grande.bin') -PassThru
          Start-Sleep -Seconds 15
          if (-not $process.HasExited) { $process.Kill() }
          $report = @()
          $report += "final=$(Test-Path 'C:\xopytest\dest5\grande.bin')"
          $report += "temporal=$((Get-ChildItem 'C:\xopytest\dest5' -Force -Filter '*.xopy-part').Count)"
          if (Test-Path 'C:\xopytest\dest5\grande.bin') {
            $report += "hash_igual=$((Get-FileHash 'C:\xopytest\dest5\grande.bin').Hash -eq (Get-FileHash 'C:\xopytest\grande.bin').Hash)"
          }
          # Que el archivo acabe bien NO demuestra que se reanudara: si XoPy decidiera
          # copiarlo entero desde cero el resultado sería idéntico. Lo que lo demuestra es
          # el renglón del registro (y que la opción siga encendida, que es justo lo que
          # cada pegado estaba apagando sin que nadie lo tocara).
          $log = Join-Path $env:LOCALAPPDATA 'XoPy\transfer.log'
          $reanudo = $false
          $opcion = ''
          if (Test-Path $log) {
            $reanudo = (Select-String -Path $log -Pattern 'Reanudando .*grande\.bin' -Quiet) -eq $true
            $ultima = Select-String -Path $log -Pattern 'reanudar=(\w+)' | Select-Object -Last 1
            if ($ultima) { $opcion = $ultima.Matches[0].Groups[1].Value }
          }
          $report += "reanudo_de_verdad=$reanudo"
          $report += "opcion_reanudar=$opcion"
          $report | Set-Content C:\xopytest\reanudartest.txt
          Get-Content C:\xopytest\reanudartest.txt
          Write-Host ("::notice title=Reanudar::" + ($report -join ' | '))
          if ($opcion -eq 'False') { throw 'Pegar desde el Explorador apagó la opción «reanudar copias parciales»' }
          if (-not $reanudo) { throw 'No se aprovechó el trozo ya copiado: se copió el archivo entero otra vez' }
          if (-not (Test-Path 'C:\xopytest\dest5\grande.bin')) { throw 'No se completó la copia reanudada' }
          if ((Get-FileHash 'C:\xopytest\dest5\grande.bin').Hash -ne (Get-FileHash 'C:\xopytest\grande.bin').Hash) { throw 'El archivo reanudado no coincide' }
          if ((Get-ChildItem 'C:\xopytest\dest5' -Force -Filter '*.xopy-part').Count -gt 0) { throw 'Quedó un temporal tras reanudar' }

      - name: Prueba de rendimiento (copia de 200 MB y 300 archivos)
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          # Volumen grande: 200 MB en un archivo (rendimiento de flujo) y 300 archivos
          # pequeños (rendimiento de metadatos y de cola).
          New-Item -ItemType Directory -Force C:\xopytest\perf | Out-Null
          $bytes = New-Object byte[] (1MB)
          (New-Object Random).NextBytes($bytes)
          $stream = [IO.File]::Create('C:\xopytest\perf\grande.bin')
          1..200 | ForEach-Object { $stream.Write($bytes, 0, $bytes.Length) }
          $stream.Close()
          New-Item -ItemType Directory -Force C:\xopytest\perf\muchos | Out-Null
          1..300 | ForEach-Object {
            [IO.File]::WriteAllBytes("C:\xopytest\perf\muchos\f$_.bin", [byte[]]::new(2048))
          }
          New-Item -ItemType Directory -Force C:\xopytest\perf-destino | Out-Null

          $report = @()
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--to', 'C:\xopytest\perf-destino', 'C:\xopytest\perf\grande.bin') -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'La copia grande no terminó a tiempo' }
          $sw.Stop()
          $copiado = (Get-Item 'C:\xopytest\perf-destino\grande.bin' -ErrorAction SilentlyContinue).Length
          $segundos = [Math]::Max(0.001, $sw.Elapsed.TotalSeconds)
          $report += "grande_existe=$($copiado -eq 209715200)"
          $report += "grande_bytes=$copiado"
          $report += "grande_segundos=$([Math]::Round($segundos, 2))"
          $report += "grande_MBps=$([Math]::Round(200 / $segundos, 1))"
          $report += "grande_hash_igual=$((Get-FileHash 'C:\xopytest\perf-destino\grande.bin').Hash -eq (Get-FileHash 'C:\xopytest\perf\grande.bin').Hash)"

          $sw2 = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--to', 'C:\xopytest\perf-destino', 'C:\xopytest\perf\muchos') -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'La copia de muchos archivos no terminó a tiempo' }
          $sw2.Stop()
          $count = @(Get-ChildItem 'C:\xopytest\perf-destino\muchos' -File -ErrorAction SilentlyContinue).Count
          $report += "muchos_copiados=$count"
          $report += "muchos_segundos=$([Math]::Round($sw2.Elapsed.TotalSeconds, 2))"
          $report += "muchos_por_segundo=$([Math]::Round(300 / [Math]::Max(0.001, $sw2.Elapsed.TotalSeconds), 0))"
          $report | Set-Content C:\xopytest\perf.txt
          Get-Content C:\xopytest\perf.txt
          $medido = ($report -join ' | ') -replace '%','%25'
          Write-Host "::notice title=Rendimiento::$medido"
          if ($copiado -ne 209715200) { throw 'La copia grande no tiene el tamaño correcto' }
          if ($count -ne 300) { throw "Se esperaban 300 archivos y hay $count" }
          $memoria = (Get-Process XoPy -ErrorAction SilentlyContinue | Measure-Object WorkingSet64 -Maximum).Maximum
          if ($memoria) { Write-Host "::notice title=Memoria::pico_MB=$([Math]::Round($memoria / 1MB, 1))" }

      - name: Pegar en la MISMA carpeta (nombre nuevo, el origen no se toca)
        shell: pwsh
        run: |
          # Caso del informe: al pegar donde ya está el archivo, XoPy debe crear una copia
          # con otro nombre y NO sobrescribir el original.
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          # Los ajustes del runner arrastran destinos extra de pruebas anteriores; esta prueba
          # necesita estado limpio para comprobar de verdad dónde cae la copia.
          $cfgDir = Join-Path $env:LOCALAPPDATA 'XoPy'
          if (Test-Path $cfgDir) { Remove-Item $cfgDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force C:\xopytest\misma | Out-Null
          Set-Content 'C:\xopytest\misma\original.txt' ('o' * 3000)
          $before = (Get-FileHash 'C:\xopytest\misma\original.txt').Hash
          $process = Start-Process -FilePath $exe -ArgumentList @('--copy', '--exit', '--to', 'C:\xopytest\misma', 'C:\xopytest\misma\original.txt') -PassThru
          Start-Sleep -Seconds 14
          if (-not $process.HasExited) { $process.Kill() }
          $report = @()
          $report += "original_intacto=$((Get-FileHash 'C:\xopytest\misma\original.txt').Hash -eq $before)"
          $copias = @(Get-ChildItem 'C:\xopytest\misma' -File | Where-Object { $_.Name -ne 'original.txt' })
          $report += "copias=$($copias.Count)"
          $report += "nombres=$($copias.Name -join ',')"
          $report | Set-Content C:\xopytest\mismacarpeta.txt
          Get-Content C:\xopytest\mismacarpeta.txt
          Write-Host ("::notice title=Misma carpeta::" + (($report -join ' | ') -replace '%','%25'))
          if ((Get-FileHash 'C:\xopytest\misma\original.txt').Hash -ne $before) { throw 'Se sobrescribió el archivo original' }
          if ($copias.Count -lt 1) { throw 'No se creó la copia con otro nombre' }

      - name: Probar reordenar, ordenar y quitar de la lista
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-queue', 'C:\xopytest\cola.txt') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'La prueba de la cola no terminó' }
          Get-Content C:\xopytest\cola.txt
          # Se publica como anotación: los logs del run no son accesibles desde la API.
          $report = (Get-Content C:\xopytest\cola.txt) -join ' | '
          $report = $report -replace '%','%25' -replace '\r','' -replace '\n','%0A'
          Write-Host "::notice title=Prueba de cola::$report"
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::La prueba de la cola falló"
            throw "La prueba de la cola falló: $(Get-Content C:\xopytest\cola.txt)"
          }
          Write-Host "Prueba de la cola superada" 

      - name: Copiar, recopiar y mover la misma lista (captura 15)
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\publish\XoPy.exe).Path
          $report = 'C:\xopytest\repeticion.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-repeat', $report) -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'La prueba de repetición no terminó' }
          Get-Content $report
          $detail = (Get-Content $report) -join ' | '
          $detail = $detail -replace '%','%25' -replace '\r','' -replace '\n','%0A'
          Write-Host "::notice title=Prueba de repeticion::$detail"
          if ($process.ExitCode -ne 0) {
            Write-Host "::error title=Prueba de repeticion::$detail"
            throw "La prueba de repetición falló: $detail"
          }
          Write-Host "Prueba de repetición superada"

      - name: Guardar la captura en el repositorio
        shell: pwsh
        run: |
          git config user.name "XoPy Bot"
          git config user.email "xopy-bot@users.noreply.github.com"
          git add docs/xopy-preview.png docs/xopy-compacta.png docs/xopy-tab-*.png docs/xopy-dropdown.png docs/xopy-contextmenu.png docs/xopy-options.png docs/xopy-advanced.png docs/xopy-conflict.png docs/xopy-verify.png docs/xopy-history.png
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Añadir captura automática de la interfaz"
            git push
          }

      - name: Guardar diagnóstico si falla
        if: failure()
        shell: pwsh
        run: |
          dotnet build XoPy/XoPy.csproj -c Release -r win-x64 --self-contained true *> build-errors.txt
          $out = @()
          $out += Get-Content 'build-errors.txt' -ErrorAction SilentlyContinue
          Get-ChildItem 'C:\xopytest' -ErrorAction SilentlyContinue | ForEach-Object { $out += "FILE: $($_.Name) ($($_.Length) bytes)" }
          foreach ($file in @('C:\xopytest\exitcode.txt', 'C:\xopytest\shot.png.log', 'C:\xopytest\shot.png.error.txt', 'C:\xopytest\tab.error.txt', 'C:\xopytest\options.png.error.txt', 'C:\xopytest\conflict.png.error.txt', 'C:\xopytest\menu.error.txt', 'C:\xopytest\copiatest.txt', 'C:\xopytest\movetest.txt', 'C:\xopytest\conflictotest.txt', 'C:\xopytest\jerarquiatest.txt', 'C:\xopytest\reanudartest.txt', 'C:\xopytest\cola.txt', 'C:\xopytest\robocopytest.txt', 'C:\xopytest\history.png.error.txt')) {
            if (Test-Path $file) { $out += "--- $file"; $out += Get-Content $file }
          }
          # Registro propio de la aplicación (destinos, conflictos y errores de copia).
          $startupLog = Join-Path $env:LOCALAPPDATA 'XoPy\startup.log'
          if (Test-Path $startupLog) {
            $out += '--- startup.log (últimas 80 líneas)'
            $out += Get-Content $startupLog -Tail 80
          }
          $log = Join-Path $env:LOCALAPPDATA 'XoPy\transfer.log'
          if (Test-Path $log) {
            $out += "--- transfer.log (últimas 120 líneas)"
            $out += Get-Content $log -Tail 120
          }
          New-Item -ItemType Directory -Force docs | Out-Null
          $out | Set-Content docs\diagnostics.txt
          git config user.name "XoPy Bot"
          git config user.email "xopy-bot@users.noreply.github.com"
          git add docs/diagnostics.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Diagnóstico de la captura de interfaz"
            git push
          }

      - uses: actions/upload-artifact@v4
        with:
          name: xopy-preview
          path: docs/xopy-preview.png
          if-no-files-found: error
          retention-days: 14
