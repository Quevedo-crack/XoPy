name: Build Windows x64

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar aplicación autocontenida
        run: dotnet publish XoPy/XoPy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "No se encontró el compilador de Inno Setup: $compiler" }
          & $compiler /Qp installer/XoPy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: XoPy-Setup-win-x64
          path: installer-output/XoPy-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
