name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar una release con esta etiqueta (ej. v2.0.0). Dejar vacío para solo compilar."
        required: false
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar aplicación autocontenida
        shell: pwsh
        run: |
          dotnet publish XoPy/XoPy.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
            -o publish -v:d 2>&1 | Tee-Object -FilePath build.log
          $publishExit = $LASTEXITCODE
          # Se comprueba el resultado real además del código de salida: con Tee-Object el
          # código podía leerse antes de tiempo y fallar un publish que sí había funcionado.
          if ($publishExit -ne 0 -or -not (Test-Path 'publish/XoPy.exe')) {
            Write-Host "publish_exit=$publishExit"
            throw "No se pudo publicar la aplicación (código $publishExit)"
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar extensión de menú contextual x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          cl.exe /nologo /LD /EHsc /O2 ShellExtension\XoPyShell.cpp /link /DEF:ShellExtension\XoPyShell.def /OUT:publish\XoPyShell.dll shell32.lib user32.lib advapi32.lib ole32.lib uuid.lib gdi32.lib 2>&1 | Tee-Object -FilePath shell-extension-build.log
          $compileExit = $LASTEXITCODE
          if ($compileExit -ne 0) { throw "No se pudo compilar la extensión C++ (código $compileExit)" }


      - name: Adjuntar log de la extensión si falla
        if: failure() && hashFiles('shell-extension-build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shell-extension-build-log
          path: shell-extension-build.log
          retention-days: 7

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Verificar contenido de publish antes del instalador
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          if (-not (Test-Path 'publish/XoPy.exe')) { throw 'No se encontró publish/XoPy.exe tras el publish' }

      - name: Crear instalador
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "No se encontró el compilador de Inno Setup: $compiler" }
          & $compiler /Qp installer/XoPy.iss 2>&1 | Tee-Object -FilePath installer-build.log
          $installerExit = $LASTEXITCODE
          if ($installerExit -ne 0) { throw "No se pudo compilar el instalador (código $installerExit)" }

      # El log del instalador solo se puede leer descargando un artefacto; publicarlo como
      # anotación deja el error de Inno Setup visible directamente en el resumen del job.
      - name: Publicar errores del instalador como anotación
        if: failure() && hashFiles('installer-build.log') != ''
        shell: pwsh
        run: |
          Get-Content installer-build.log | Where-Object { $_ -match 'Error|error|Fatal|falló|failed' } |
            Select-Object -First 20 | ForEach-Object { Write-Host "::error file=installer/XoPy.iss::$_" }
          Get-Content installer-build.log | Select-Object -Last 15 |
            ForEach-Object { Write-Host "::error file=installer/XoPy.iss::$_" }

      - name: Comprobar el resultado
        shell: pwsh
        run: |
          if (-not (Test-Path 'installer-output/XoPy-Setup-win-x64.exe')) { throw 'No se generó el instalador' }
          Get-ChildItem publish | Select-Object Name, Length
          Get-ChildItem installer-output | Select-Object Name, Length

      - name: Probar el instalador
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $log = 'C:\install-test.txt'
          "inicio $(Get-Date -Format o)" | Set-Content $log
          try {
            $setup = (Resolve-Path 'installer-output/XoPy-Setup-win-x64.exe').Path
            $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=autostart') -Wait -PassThru
            "instalador_exit=$($install.ExitCode)" | Add-Content $log

            $exe = Join-Path $env:ProgramFiles 'XoPy\XoPy.exe'
            "exe_instalado=$(Test-Path $exe)" | Add-Content $log

            $legacyMenu = @('*\shell\XoPyCopy', '*\shell\XoPyCopyTo', '*\shell\XoPyMove', '*\shell\XoPyMoveTo', '*\shell\XoPyVerify', 'Directory\shell\XoPyCopy', 'Directory\shell\XoPyCopyTo', 'Directory\shell\XoPyMove', 'Directory\shell\XoPyMoveTo', 'Directory\shell\XoPyVerify', 'Directory\Background\shell\XoPyPaste', 'Directory\Background\shell\XoPyOpen')
            $remaining = @($legacyMenu | Where-Object { [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\Classes\$_") -ne $null })
            "entradas_antiguas=$($remaining.Count)" | Add-Content $log
            $handler = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Classes\Directory\Background\shellex\ContextMenuHandlers\XoPyPaste', '', $null)
            "extensio_pegar=$handler" | Add-Content $log
            # La clave CLSID es la que hace que Ctrl+V abra XoPy: si desaparece al arrancar la
            # aplicación, la integración no sustituye al copiador de Windows.
            $inproc = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Classes\CLSID\{3B1E92A7-7AD6-4E71-A218-75449CE13061}\InprocServer32', '', $null)
            "clsid_inproc=$inproc" | Add-Content $log
            $dll = Join-Path $env:ProgramFiles 'XoPy\XoPyShell.dll'
            "dll_extension=$(Test-Path $dll)" | Add-Content $log
            if ($remaining.Count -gt 0) { throw 'El instalador dejó entradas de menú contextual antiguas' }
            if (-not $handler -or -not (Test-Path $dll)) { throw 'No quedó registrada la extensión del comando Pegar' }
            Add-Type -TypeDefinition @'
            using System;
            using System.Runtime.InteropServices;
            public static class XoPyComSmoke {
              [DllImport("ole32.dll", PreserveSig=true)] static extern int CoCreateInstance(ref Guid clsid, IntPtr outer, uint context, ref Guid iid, out IntPtr instance);
              [DllImport("ole32.dll")] static extern int CoInitializeEx(IntPtr reserved, uint flags);
              [DllImport("ole32.dll")] static extern void CoUninitialize();
              public static int Check() {
                int initialized = CoInitializeEx(IntPtr.Zero, 0);
                try {
                  Guid clsid = new Guid("3B1E92A7-7AD6-4E71-A218-75449CE13061");
                  Guid iid = new Guid("000214E8-0000-0000-C000-000000000046");
                  IntPtr instance;
                  int result = CoCreateInstance(ref clsid, IntPtr.Zero, 1, ref iid, out instance);
                  if (instance != IntPtr.Zero) Marshal.Release(instance);
                  return result;
                } finally { if (initialized >= 0) CoUninitialize(); }
              }
            }
          '@
            $comResult = 1
            for ($try = 1; $try -le 5; $try++) {
              $comResult = [XoPyComSmoke]::Check()
              if ($comResult -eq 0) { break }
              "com_activation_intento_${try}=0x$('{0:X8}' -f $comResult)" | Add-Content $log
              Start-Sleep -Seconds 3
            }
            "com_activation=0x$('{0:X8}' -f $comResult)" | Add-Content $log
            if ($comResult -ne 0) { throw "No se pudo cargar la extensión COM (HRESULT $comResult)" }

            if (-not (Test-Path $exe)) { throw 'No se instaló XoPy.exe en Program Files' }

            $shot = 'C:\installed-shot.png'
            $app = Start-Process -FilePath $exe -ArgumentList @('--screenshot', $shot) -PassThru
            if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'La aplicación instalada no respondió' }
            "captura_instalada=$(Test-Path $shot)" | Add-Content $log

            # Arrancar la aplicación no debe eliminar la extensión registrada.
            $after = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Classes\CLSID\{3B1E92A7-7AD6-4E71-A218-75449CE13061}\InprocServer32', '', $null)
            "clsid_tras_arrancar=$after" | Add-Content $log
            if (-not $after) { throw 'La aplicación borró la extensión Pegar al arrancar' }
            if (-not $inproc) { throw 'El instalador no registró la extensión Pegar' }

            # Se crean datos de usuario para comprobar que la desinstalación NO deja restos
            # (settings.json, history.json, ultima-cola.xopyq, transfer.log).
            $dataDir = Join-Path $env:LOCALAPPDATA 'XoPy'
            New-Item -ItemType Directory -Force $dataDir | Out-Null
            '{"SettingsVersion":1}' | Set-Content (Join-Path $dataDir 'settings.json')
            '[]' | Set-Content (Join-Path $dataDir 'history.json')
            'datos' | Set-Content (Join-Path $dataDir 'transfer.log')
            "datos_antes=$(Test-Path $dataDir)" | Add-Content $log

            $uninstaller = Join-Path $env:ProgramFiles 'XoPy\unins000.exe'
            "desinstalador=$(Test-Path $uninstaller)" | Add-Content $log
            if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait
              Start-Sleep -Seconds 5
            }
            "sigue_instalado=$(Test-Path $exe)" | Add-Content $log
            # El .exe autocontenido ya no se extrae; se comprueba también su subcarpeta de
            # extracción por si quedara de una versión anterior.
            $appDir = Join-Path $env:ProgramFiles 'XoPy'
            if (Test-Path $appDir) {
              "contenido_restante=$((Get-ChildItem $appDir -Force | Select-Object -ExpandProperty Name) -join ',')" | Add-Content $log
            }
            $restos = @()
            if (Test-Path $exe) { $restos += 'exe' }
            if (Test-Path (Join-Path $env:ProgramFiles 'XoPy')) { $restos += 'carpeta_app' }
            if (Test-Path $dataDir) { $restos += 'datos_localappdata' }
            $clsidAfterUninstall = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Classes\CLSID\{3B1E92A7-7AD6-4E71-A218-75449CE13061}', 'x', $null)
            if ($null -ne $clsidAfterUninstall) { $restos += 'clsid' }
            $pasteAfter = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Classes\Directory\Background\shellex\ContextMenuHandlers\XoPyPaste', '', $null)
            if ($pasteAfter) { $restos += 'pegar' }
            $runAfter = [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run', 'XoPy', $null)
            if ($runAfter) { $restos += 'autostart' }
            "restos_desinstalacion=$($restos -join ',')" | Add-Content $log
            Write-Host "restos_desinstalacion=$($restos -join ',')"
            # Se comprueba que la SUBCARPETA (restos de la extracción del .exe) no sobreviva
            # y que no queden datos, registro ni accesos. La carpeta {app} en sí puede
            # quedar un instante si el Explorador aún tiene la DLL mapeada y el desinstalador
            # ya programó el borrado al reiniciar, así que solo falla si quedan archivos.
            $appFiles = @()
            if (Test-Path $appDir) { $appFiles = @(Get-ChildItem $appDir -Force) }
            "archivos_restantes_app=$($appFiles.Count)" | Add-Content $log
            if ($appFiles.Count -gt 0) {
              $restos += 'archivos_app'
              "detalle_archivos=$((($appFiles | ForEach-Object { "$($_.Name)($($_.Length))" }) -join ','))" | Add-Content $log
            }
            $bad = $restos | Where-Object { $_ -ne 'carpeta_app' }
            if ($bad) { throw "La desinstalación dejó restos: $($bad -join ', ')" }
            "OK" | Add-Content $log
          } catch {
            "ERROR: $_" | Add-Content $log
            Get-Content $log | Write-Host
            # El log se publica como anotación: es la vía fiable para verlo desde fuera.
            $detail = (Get-Content $log -ErrorAction SilentlyContinue) -join ' | '
            if ($detail.Length -gt 3800) { $detail = $detail.Substring(0, 3800) }
            Write-Host "::error title=Prueba del instalador::$detail"
            throw
          }
          Get-Content $log | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: XoPy-Setup-win-x64
          path: installer-output/XoPy-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: XoPy-Portable-win-x64
          path: publish/XoPy.exe
          if-no-files-found: error
          retention-days: 30

      - name: Subir log de build si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # Los artefactos no siempre se pueden descargar desde el agente: los errores del
      # compilador se publican también como anotación, que sí se puede leer por la API.
      - name: Publicar errores de la extensión C++ como anotación
        if: failure() && hashFiles('shell-extension-build.log') != ''
        shell: pwsh
        run: |
          $errors = Select-String -Path shell-extension-build.log -Pattern 'error|warning C' | Select-Object -First 25
          foreach ($e in $errors) {
            $line = ($e.Line -replace '%','%25' -replace '\r','' -replace '\n','%0A')
            Write-Host "::error file=ShellExtension/XoPyShell.cpp::$line"
          }

      - name: Publicar errores de compilación como anotación
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host "::warning::No hay build.log"; exit 0 }
          $errors = Select-String -Path build.log -Pattern 'error (CS|MSB|NETSDK|NU)\d+' | Select-Object -First 25
          foreach ($e in $errors) {
            $line = ($e.Line -replace '%','%25' -replace '\r','' -replace '\n','%0A')
            Write-Host "::error file=XoPy/XoPy.csproj::$line"
          }
          # Solo se avisa de «publish falló» si de verdad no se generó el ejecutable: antes
          # este mensaje aparecía también cuando el job fallaba en otro paso (por ejemplo,
          # la prueba del instalador) y despistaba.
          if ($errors.Count -eq 0 -and -not (Test-Path 'publish/XoPy.exe')) {
            Write-Host "::error::El publish falló sin errores CS/MSB visibles en build.log"
          }

      - name: Subir log de instalador si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-log
          path: installer-build.log
          retention-days: 7

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @('installer-output/XoPy-Setup-win-x64.exe', 'publish/XoPy.exe')
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assets --target $env:RELEASE_TARGET --title "XoPy $tag" --generate-notes
          } else {
            gh release upload $tag $assets --clobber
          }
