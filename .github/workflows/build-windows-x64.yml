name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar una release con esta etiqueta (ej. v2.0.0). Dejar vacío para solo compilar."
        required: false
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar aplicación autocontenida
        run: >
          dotnet publish XoPy/XoPy.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "No se encontró el compilador de Inno Setup: $compiler" }
          & $compiler /Qp installer/XoPy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Comprobar el resultado
        shell: pwsh
        run: |
          if (-not (Test-Path 'installer-output/XoPy-Setup-win-x64.exe')) { throw 'No se generó el instalador' }
          Get-ChildItem publish | Select-Object Name, Length
          Get-ChildItem installer-output | Select-Object Name, Length

      - name: Probar el instalador
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'installer-output/XoPy-Setup-win-x64.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=explorer,sendto') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "El instalador devolvió el código $($install.ExitCode)" }

          $exe = Join-Path $env:ProgramFiles 'XoPy\XoPy.exe'
          if (-not (Test-Path $exe)) { throw 'No se instaló XoPy.exe en Program Files' }

          $copyCommand = (Get-ItemProperty 'HKCU:\Software\Classes\*\shell\XoPyCopy\command').'(default)'
          Write-Host "menu copiar: $copyCommand"
          if (-not $copyCommand.Contains('--copy')) { throw 'No se registró Copiar con XoPy' }

          $pasteCommand = (Get-ItemProperty 'HKCU:\Software\Classes\Directory\Background\shell\XoPyPaste\command').'(default)'
          Write-Host "menu pegar: $pasteCommand"
          if (-not $pasteCommand.Contains('--paste')) { throw 'No se registró Pegar con XoPy' }

          $sendTo = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo\Copiar con XoPy.lnk'
          if (-not (Test-Path $sendTo)) { throw 'No se creó el acceso en Enviar a' }

          $shot = 'C:\xopytest\installed.png'
          $app = Start-Process -FilePath $exe -ArgumentList @('--screenshot', $shot) -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'La aplicación instalada no respondió' }
          if (-not (Test-Path $shot)) { throw 'La aplicación instalada no arrancó correctamente' }
          Write-Host "tamaño captura: $((Get-Item $shot).Length) bytes"

          $uninstaller = Join-Path $env:ProgramFiles 'XoPy\unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'No se encontró el desinstalador' }
          Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'La desinstalación dejó archivos en Program Files' }
          Write-Host 'Instalación y desinstalación correctas'

      - uses: actions/upload-artifact@v4
        with:
          name: XoPy-Setup-win-x64
          path: installer-output/XoPy-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: XoPy-Portable-win-x64
          path: publish/XoPy.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @('installer-output/XoPy-Setup-win-x64.exe', 'publish/XoPy.exe')
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assets --target $env:RELEASE_TARGET --title "XoPy $tag" --generate-notes
          } else {
            gh release upload $tag $assets --clobber
          }
